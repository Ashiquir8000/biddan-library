<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Register User</title>
</head>
<body>

<header>
    <nav>
        <a th:href="@{/books}">Books</a> |
        <a th:href="@{/categories}">Categories</a> |
        <a th:href="@{/borrows}">Borrow Records</a> |
        <a th:href="@{/borrows/issue}">Issue Book</a> |
        <a th:href="@{/users}">Users</a> |
        <a th:href="@{/users/register}">Register</a>
    </nav>
</header>

<main>
    <h2>Notun User Registration</h2>

    <!-- Error Alert -->
    <div th:if="${errorMessage}">
        <p style="color: red;" th:text="${errorMessage}"></p>
    </div>

    <form th:action="@{/users/register}" th:object="${userDto}" method="post">
        <div>
            <label>Puro Nam (Full Name):</label><br>
            <input type="text" th:field="*{name}" />
            <span style="color: red;" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <br>

        <div>
            <label>Email:</label><br>
            <input type="email" th:field="*{email}" />
            <span style="color: red;" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <br>

        <div>
            <label>Password:</label><br>
            <input type="password" th:field="*{password}" />
            <span style="color: red;" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>
        <br>

        <div>
            <label>Phone Number:</label><br>
            <input type="text" th:field="*{phone}" placeholder="017XXXXXXXX" />
            <span style="color: red;" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </div>
        <br>

        <button type="submit">Register User</button>
        <a th:href="@{/users}">Cancel</a>
    </form>
</main>

</body>
</html>
