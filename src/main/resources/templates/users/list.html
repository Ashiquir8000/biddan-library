<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Users List</title>
</head>
<body>

<header>
    <nav>
        <a th:href="@{/books}">Books</a> |
        <a th:href="@{/categories}">Categories</a> |
        <a th:href="@{/borrows}">Borrow Records</a> |
        <a th:href="@{/borrows/issue}">Issue Book</a> |
        <a th:href="@{/users}">Users</a> |
        <a th:href="@{/users/register}">Register</a>
    </nav>
</header>

<main>
    <h2>Users List (Member-der Talika)</h2>

    <!-- Flash Messages -->
    <div th:if="${successMessage}">
        <p style="color: green;" th:text="${successMessage}"></p>
    </div>

    <div>
        <a th:href="@{/users/register}">+ Notun User Jog Korun</a>
    </div>

    <br>

    <!-- Users Table -->
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Status</th>
            <th>Joined Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="6">Kono user paowa jayni.</td>
        </tr>
        <tr th:each="u : ${users}">
            <td th:text="${u.name}">John Doe</td>
            <td th:text="${u.email}">john@mail.com</td>
            <td th:text="${u.phone}">01700000000</td>
            <td th:text="${u.role}">ROLE_USER</td>
            <td>
                        <span th:text="${u.active ? 'Active' : 'Inactive'}"
                              th:style="${u.active ? 'color: green;' : 'color: red;'}">
                            Active
                        </span>
            </td>
            <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">2026-09-23 18:00</td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
