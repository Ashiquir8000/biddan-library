<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Issue Book</title>
</head>
<body>

<header>
    <nav>
        <a th:href="@{/books}">Books</a> |
        <a th:href="@{/categories}">Categories</a> |
        <a th:href="@{/borrows}">Borrow Records</a> |
        <a th:href="@{/borrows/issue}">Issue Book</a> |
        <a th:href="@{/users}">Users</a> |
        <a th:href="@{/users/register}">Register</a>
    </nav>
</header>

<main>
    <h2>Boi Issue Korun (Borrow Book)</h2>

    <!-- Error Alert -->
    <div th:if="${errorMessage}">
        <p style="color: red;" th:text="${errorMessage}"></p>
    </div>

    <form th:action="@{/borrows/issue}" th:object="${borrowDto}" method="post">

        <!-- User Selection -->
        <div>
            <label>User Nirbachon Korun:</label><br>
            <select th:field="*{userId}">
                <option value="">-- User Select Korun --</option>
                <option th:each="user : ${users}"
                        th:value="${user.id}"
                        th:text="${user.name} + ' (' + ${user.email} + ')'">
                </option>
            </select>
            <span style="color: red;" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></span>
        </div>
        <br>

        <!-- Book Selection -->
        <div>
            <label>Boi Nirbachon Korun:</label><br>
            <select th:field="*{bookId}">
                <option value="">-- Boi Select Korun --</option>
                <option th:each="book : ${books}"
                        th:value="${book.id}"
                        th:text="${book.title} + ' [Available: ' + ${book.availableCopies} + ']'"
                        th:disabled="${book.availableCopies == 0}">
                </option>
            </select>
            <span style="color: red;" th:if="${#fields.hasErrors('bookId')}" th:errors="*{bookId}"></span>
        </div>
        <br>

        <!-- Due Date Selection -->
        <div>
            <label>Ferot Dewar Tarikh (Due Date):</label><br>
            <input type="date" th:field="*{dueDate}" />
            <span style="color: red;" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></span>
        </div>
        <br>

        <button type="submit">Issue Book</button>
        <a th:href="@{/borrows}">Cancel</a>
    </form>
</main>

</body>
</html>
